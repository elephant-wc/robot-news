<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机器人行业资讯 · ROBOT INTEL</title>
<style>
/* ── Token system ──────────────────────────────────────────── */
:root {
  --bg:      #060B14;
  --surf:    #0A1628;
  --surf-h:  #0D1E36;
  --border:  #142440;
  --border2: #1C3357;
  --blue:    #38BDF8;
  --cyan:    #22D3EE;
  --green:   #34D399;
  --text1:   #CBD5E1;
  --text2:   #64748B;
  --text3:   #2D4A6A;
  --font:    -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
  --mono:    'SF Mono', 'Menlo', 'Cascadia Mono', 'Consolas', monospace;
}

/* ── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font);
  background-color: var(--bg);
  /* Dot grid — engineering blueprint feel */
  background-image: radial-gradient(circle, rgba(20,36,64,0.7) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
  color: var(--text1);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
::selection { background: rgba(56,189,248,0.2); }

/* ── Top bar ───────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, #04090F 0%, #070D1A 100%);
  border-bottom: 1px solid var(--border2);
  padding: 0 22px;
  height: 56px;
  display: flex; align-items: center; gap: 16px;
  overflow: hidden;
}
/* Scanline texture */
.topbar::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
  );
}
/* Moving scan beam */
.topbar::after {
  content: ''; position: absolute;
  top: 0; left: -40%; width: 28%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(56,189,248,0.045), transparent);
  animation: scan-beam 9s linear infinite;
}
@keyframes scan-beam { to { left: 120%; } }

.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  font-size: 20px; color: var(--blue);
  text-shadow: 0 0 14px rgba(56,189,248,0.65), 0 0 28px rgba(56,189,248,0.25);
}
.brand-name {
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.04em; color: var(--text1); white-space: nowrap;
}
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono);
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;
  color: var(--green);
  border: 1px solid rgba(52,211,153,0.38);
  padding: 2px 8px; border-radius: 2px;
  background: rgba(52,211,153,0.05);
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 7px var(--green);
  animation: pulse-dot 1.8s ease-in-out infinite;
}
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

.topbar-meta {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.06em;
  overflow: hidden;
}
.mk { color: var(--text3); text-transform: uppercase; }
.mv { color: var(--text2); }
.md { color: var(--border2); }

.admin-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 3px; padding: 6px 14px;
  cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  background: transparent;
}
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-fetch {
  border: 1px solid rgba(56,189,248,0.45);
  color: var(--blue);
  box-shadow: 0 0 10px rgba(56,189,248,0.07), inset 0 0 8px rgba(56,189,248,0.04);
}
.btn-fetch:hover:not(:disabled) {
  border-color: var(--blue);
  background: rgba(56,189,248,0.08);
  box-shadow: 0 0 18px rgba(56,189,248,0.2), inset 0 0 12px rgba(56,189,248,0.07);
}
.btn-publish {
  border: 1px solid rgba(52,211,153,0.42);
  color: var(--green);
  box-shadow: 0 0 10px rgba(52,211,153,0.06), inset 0 0 8px rgba(52,211,153,0.03);
}
.btn-publish:hover:not(:disabled) {
  border-color: var(--green);
  background: rgba(52,211,153,0.07);
  box-shadow: 0 0 18px rgba(52,211,153,0.18), inset 0 0 12px rgba(52,211,153,0.06);
}

/* ── Progress beam ─────────────────────────────────────────── */
.progress {
  height: 2px; background: var(--border);
  display: none; position: relative; overflow: hidden;
}
.progress.on { display: block; }
.p-fill {
  position: absolute; height: 100%; width: 32%;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), transparent);
  animation: pbeam 1.1s ease-in-out infinite;
}
@keyframes pbeam { 0% { left: -32%; } 100% { left: 115%; } }

/* ── Alert ─────────────────────────────────────────────────── */
.alert {
  display: none; padding: 8px 22px;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
  align-items: center; gap: 10px; border-bottom: 1px solid;
}
.alert.on { display: flex; }
.alert.info    { background: rgba(56,189,248,0.05); color: var(--cyan);  border-color: rgba(56,189,248,0.18); }
.alert.success { background: rgba(52,211,153,0.05); color: var(--green); border-color: rgba(52,211,153,0.18); }
.alert.error   { background: rgba(244,63,94,0.05);  color: #F87171;     border-color: rgba(244,63,94,0.18); }
.alert-x { margin-left: auto; cursor: pointer; opacity: .45; font-size: 14px; flex-shrink: 0; }
.alert-x:hover { opacity: 1; }

/* ── Filter bar ────────────────────────────────────────────── */
.tabs-wrap {
  display: none; align-items: center; gap: 6px;
  padding: 8px 22px;
  background: rgba(5,9,18,0.94);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
  position: sticky; top: 56px; z-index: 90;
  backdrop-filter: blur(10px);
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tabs-wrap.on { display: flex; }
.tab {
  flex-shrink: 0;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  padding: 5px 12px;
  border: 1px solid var(--border2); border-radius: 2px;
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: all 0.15s; white-space: nowrap;
  background: transparent;
}
.tab:hover { border-color: var(--text3); color: var(--text1); }
.tab.active { border-color: var(--blue); color: var(--blue); background: rgba(56,189,248,0.06); }
.tab .cnt { font-size: 10.5px; color: var(--text3); font-variant-numeric: tabular-nums; }
.tab.active .cnt { color: rgba(56,189,248,0.65); }

/* ── Main ──────────────────────────────────────────────────── */
.main { max-width: 960px; margin: 22px auto; padding: 0 18px; }

/* Empty */
.empty { text-align: center; padding: 80px 24px; font-family: var(--mono); }
.empty-mark { font-size: 42px; color: var(--text3); margin-bottom: 16px; }
.empty-h { font-size: 12.5px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.empty-p { font-size: 11.5px; color: var(--text3); }

/* ── Module sections ───────────────────────────────────────── */
/* Per-module color palette */
.section[data-mod="新产品发布"] { --mc: #38BDF8; --mc-bg: rgba(56,189,248,0.06); }
.section[data-mod="新功能发布"] { --mc: #C084FC; --mc-bg: rgba(192,132,252,0.06); }
.section[data-mod="重大合作"]  { --mc: #34D399; --mc-bg: rgba(52,211,153,0.06); }
.section[data-mod="营销策略"]  { --mc: #FBBF24; --mc-bg: rgba(251,191,36,0.06); }
.section[data-mod="其他"]     { --mc: #4B6078; --mc-bg: rgba(75,96,120,0.04); }

.section {
  background: var(--surf);
  border: 1px solid var(--border);
  border-left: 2px solid var(--mc, var(--border2));
  border-radius: 4px;
  margin-bottom: 12px;
  overflow: hidden;
}

/* Section header — circuit-trace rule */
.sec-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 15px;
  cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.sec-head:hover { background: var(--surf-h); }

.sec-title { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sec-sym { font-size: 12px; color: var(--mc); }
.sec-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mc);
}
/* The "circuit trace" — key signature element */
.sec-rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--mc), transparent);
  opacity: 0.22;
  min-width: 20px;
}
.sec-cnt {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
  color: var(--text3); flex-shrink: 0;
}
.chevron { font-size: 10px; color: var(--text3); transition: transform 0.2s; flex-shrink: 0; }
.chevron.collapsed { transform: rotate(-90deg); }

/* ── News items ────────────────────────────────────────────── */
.item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 15px 11px 13px;
  border-bottom: 1px solid var(--border);
  border-left: 2px solid transparent;
  transition: background 0.12s, border-left-color 0.12s;
  cursor: pointer;
}
.item:last-child { border-bottom: none; }
.item:hover { background: var(--mc-bg); border-left-color: var(--mc); }

.dot {
  width: 6px; height: 6px; border-radius: 50%;
  margin-top: 7px; flex-shrink: 0;
  background: var(--mc);
  box-shadow: 0 0 6px var(--mc);
  opacity: 0.6; transition: opacity 0.15s;
}
.item:hover .dot { opacity: 1; }

.ibody { flex: 1; min-width: 0; }
.ititle {
  display: block; font-size: 13.5px; font-weight: 500;
  color: var(--text1); line-height: 1.5; margin-bottom: 5px;
  word-break: break-word; transition: color 0.12s;
}
.item:hover .ititle { color: #E8F4FD; }
.imeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.isrc {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
  color: var(--text3);
  border: 1px solid var(--border2);
  padding: 1px 7px; border-radius: 2px;
}
.idate {
  font-family: var(--mono); font-size: 10.5px; color: var(--text3);
}
.inew {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  border: 1px solid rgba(52,211,153,0.45);
  color: var(--green);
  padding: 1px 7px; border-radius: 2px;
  background: rgba(52,211,153,0.06);
  animation: pulse-new 2.2s ease-in-out infinite;
}
@keyframes pulse-new { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ── Log ───────────────────────────────────────────────────── */
.log-wrap { max-width: 960px; margin: 0 auto; padding: 0 18px 22px; }
.log-box {
  background: #040810; border: 1px solid var(--border2);
  border-left: 2px solid rgba(56,189,248,0.3);
  border-radius: 4px; overflow: hidden; display: none;
}
.log-box.on { display: block; }
.log-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3);
}
.log-close { cursor: pointer; transition: color 0.1s; }
.log-close:hover { color: var(--text2); }
.log-body {
  padding: 12px 14px; font-family: var(--mono);
  font-size: 11.5px; line-height: 1.75;
  color: var(--text2); white-space: pre-wrap; word-break: break-all;
  max-height: 260px; overflow-y: auto;
}
.log-body::-webkit-scrollbar { width: 3px; }
.log-body::-webkit-scrollbar-track { background: transparent; }
.log-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Footer ────────────────────────────────────────────────── */
.footer {
  text-align: center; padding: 22px;
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text3); line-height: 2.2;
}
.footer code {
  color: var(--text2); border: 1px solid var(--border2);
  padding: 1px 6px; border-radius: 2px;
}

/* ── Responsive ────────────────────────────────────────────── */
@media (max-width: 620px) {
  .topbar { padding: 0 14px; gap: 10px; }
  .topbar-meta { display: none; }
  .main, .log-wrap { padding: 0 12px 20px; }
  .brand-name { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .topbar::after, .p-fill,
  .live-dot, .inew { animation: none; }
}
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">机器人行业资讯</span>
    <span class="live-badge"><span class="live-dot"></span>LIVE</span>
  </div>
  <div class="topbar-meta">
    <span class="mk">SCAN</span>
    <span class="mv" id="metaTime">——</span>
    <span class="md">·</span>
    <span class="mk">ITEMS</span>
    <span class="mv" id="metaTotal">000</span>
  </div>
  <!-- Admin controls — local only -->
  <div class="admin-bar" id="adminBar" style="display:none">
    <button class="btn btn-fetch"   id="btnFetch"   onclick="doFetch()">⬡ FETCH</button>
    <button class="btn btn-publish" id="btnPublish" onclick="doPublish()">↑ PUBLISH</button>
  </div>
</header>

<!-- ── Progress ───────────────────────────────────────────── -->
<div class="progress" id="progress"><div class="p-fill"></div></div>

<!-- ── Alert ──────────────────────────────────────────────── -->
<div class="alert" id="alert">
  <span id="alertMsg"></span>
  <span class="alert-x" onclick="hideAlert()">✕</span>
</div>

<!-- ── Filter ─────────────────────────────────────────────── -->
<nav class="tabs-wrap" id="tabsWrap"></nav>

<!-- ── Content ────────────────────────────────────────────── -->
<main class="main" id="mainContent">
  <div class="empty">
    <div class="empty-mark">◈</div>
    <div class="empty-h">INITIALIZING DATA STREAM</div>
    <div class="empty-p">Loading…</div>
  </div>
</main>

<!-- ── Log ────────────────────────────────────────────────── -->
<div class="log-wrap">
  <div class="log-box" id="logBox">
    <div class="log-head">
      <span>▸ SYSTEM LOG</span>
      <span class="log-close" onclick="document.getElementById('logBox').classList.remove('on')">CLOSE ✕</span>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<footer class="footer" id="footer"></footer>

<script>
// ─── Mode ────────────────────────────────────────────────────
const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const NEWS_URL  = IS_LOCAL ? '/api/news'  : './news_cache.json';
if (IS_LOCAL) document.getElementById('adminBar').style.display = 'flex';

// ─── Module config ───────────────────────────────────────────
const MOD_ORDER = ['新产品发布','新功能发布','重大合作','营销策略','其他'];
const MOD_ICON  = { '新产品发布':'🤖','新功能发布':'⚡','重大合作':'🤝','营销策略':'📣','其他':'📰' };

let newsData     = null;
let activeFilter = null;

// ─── Data ────────────────────────────────────────────────────
async function loadNews() {
  try {
    const r = await fetch(NEWS_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch(e) { return { items:[], last_updated:null, new_count:0, total:0 }; }
}

// ─── Actions ─────────────────────────────────────────────────
async function doFetch() {
  setBusy(true, 'fetch');
  showAlert('SCANNING — ACQUIRING LATEST ROBOT INTEL…', 'info');
  try {
    const res = await (await fetch('/api/fetch', {method:'POST'})).json();
    showLog(res.log, res.err);
    showAlert(res.ok
      ? (res.new_count > 0 ? `SCAN COMPLETE — ${res.new_count} NEW ITEMS` : 'SCAN COMPLETE — NO NEW DATA')
      : 'SCAN ERROR — CHECK SYSTEM LOG',
      res.ok ? 'success' : 'error');
    newsData = await loadNews();
    render();
  } catch(e) { showAlert('CONNECTION FAILED: ' + e.message, 'error'); }
  finally    { setBusy(false, 'fetch'); }
}

async function doPublish() {
  setBusy(true, 'publish');
  showAlert('UPLOADING TO REMOTE…', 'info');
  try {
    const res = await (await fetch('/api/publish', {method:'POST'})).json();
    showLog(res.log, res.err);
    showAlert(res.ok ? 'PUBLISH OK — REMOTE UPDATES IN ~1 MIN' : 'PUBLISH FAILED — CHECK LOG',
              res.ok ? 'success' : 'error');
  } catch(e) { showAlert('PUBLISH FAILED: ' + e.message, 'error'); }
  finally    { setBusy(false, 'publish'); }
}

// ─── UI helpers ──────────────────────────────────────────────
function setBusy(on, w) {
  document.getElementById('progress').classList.toggle('on', on);
  ['btnFetch','btnPublish'].forEach(id => document.getElementById(id).disabled = on);
  document.getElementById('btnFetch').innerHTML   = (on && w==='fetch')    ? '⏳ SCANNING…'   : '⬡ FETCH';
  document.getElementById('btnPublish').innerHTML = (on && w==='publish')  ? '⏳ UPLOADING…'  : '↑ PUBLISH';
}
function showAlert(msg, type) {
  Object.assign(document.getElementById('alertMsg'), {textContent: msg});
  document.getElementById('alert').className = `alert on ${type}`;
}
function hideAlert() { document.getElementById('alert').classList.remove('on'); }
function showLog(log, err) {
  const t = [log,err].filter(Boolean).join('\n').trim();
  if (!t) return;
  document.getElementById('logBody').textContent = t;
  document.getElementById('logBox').classList.add('on');
}

// ─── Format ──────────────────────────────────────────────────
function fmtTime(iso) {
  if (!iso) return '——';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return isNaN(d) ? iso
    : `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const pad3 = n => String(n||0).padStart(3,'0');
const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ─── Render ──────────────────────────────────────────────────
function renderMeta(d) {
  document.getElementById('metaTime').textContent  = fmtTime(d?.last_updated);
  document.getElementById('metaTotal').textContent = pad3(d?.total || d?.items?.length || 0);
}

function renderTabs(d) {
  const nav = document.getElementById('tabsWrap');
  const items = d?.items || [];
  if (!items.length) { nav.classList.remove('on'); return; }

  const counts = {};
  items.forEach(i => counts[i.module] = (counts[i.module]||0)+1);
  nav.innerHTML = ''; nav.classList.add('on');

  const mkTab = (label, mod, cnt) => {
    const t = document.createElement('div');
    t.className = 'tab' + (activeFilter === mod ? ' active' : '');
    t.innerHTML = `${esc(label)} <span class="cnt">${pad3(cnt)}</span>`;
    t.onclick = () => { activeFilter = activeFilter === mod ? null : mod; render(); };
    return t;
  };
  nav.appendChild(mkTab('ALL', null, items.length));
  MOD_ORDER.forEach(m => counts[m] && nav.appendChild(mkTab(MOD_ICON[m]+' '+m, m, counts[m])));
}

function renderContent(d) {
  const main  = document.getElementById('mainContent');
  const items = d?.items || [];

  if (!items.length) {
    main.innerHTML = `
      <div class="empty">
        <div class="empty-mark">◈</div>
        <div class="empty-h">${IS_LOCAL ? 'AWAITING FIRST SCAN' : 'NO DATA STREAM'}</div>
        <div class="empty-p">${IS_LOCAL ? 'Press FETCH to begin data acquisition' : 'Administrator has not published data yet'}</div>
      </div>`;
    return;
  }

  const newSet   = new Set(items.slice(0, d.new_count||0).map(i => i.url));
  const filtered = activeFilter ? items.filter(i => i.module === activeFilter) : items;
  const grouped  = {};
  filtered.forEach(i => (grouped[i.module] = grouped[i.module]||[]).push(i));

  main.innerHTML = '';
  MOD_ORDER.forEach(mod => grouped[mod] && main.appendChild(buildSection(mod, grouped[mod], newSet)));
}

function buildSection(mod, items, newSet) {
  const sec  = document.createElement('div');
  sec.className = 'section';
  sec.dataset.mod = mod;

  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = `
    <div class="sec-title">
      <span class="sec-sym">◈</span>
      <span class="sec-name">${esc(mod)}</span>
    </div>
    <div class="sec-rule"></div>
    <span class="sec-cnt">[ ${pad3(items.length)} ]</span>
    <span class="chevron">▾</span>`;

  const list = document.createElement('div');
  head.onclick = () => {
    const hidden = list.style.display === 'none';
    list.style.display = hidden ? '' : 'none';
    head.querySelector('.chevron').classList.toggle('collapsed', !hidden);
  };

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';
    row.onclick = e => { if (!e.target.closest('a')) window.open(item.url,'_blank','noopener'); };
    row.innerHTML = `
      <div class="dot"></div>
      <div class="ibody">
        <a class="ititle" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a>
        <div class="imeta">
          <span class="isrc">${esc(item.source||'SEARCH')}</span>
          ${item.fetched_at ? `<span class="idate">${esc(item.fetched_at)}</span>` : ''}
          ${newSet.has(item.url) ? '<span class="inew">NEW</span>' : ''}
        </div>
      </div>`;
    list.appendChild(row);
  });

  sec.appendChild(head); sec.appendChild(list);
  return sec;
}

function renderFooter() {
  document.getElementById('footer').innerHTML = IS_LOCAL
    ? `LOCAL ADMIN · <code>localhost:8080</code> · FETCH → PUBLISH TO SYNC`
    : `READ-ONLY · DATA CURATED BY ADMIN`;
}

function render() { renderMeta(newsData); renderTabs(newsData); renderContent(newsData); }

// ─── Init ─────────────────────────────────────────────────────
(async () => { newsData = await loadNews(); render(); renderFooter(); })();
</script>
</body>
</html>
